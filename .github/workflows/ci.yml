name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t tp2-notes:${{ github.sha }} .

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      # Full report (all severities) kept as an artifact, never fails the job
      - name: Bandit full report
        run: bandit -r app -f json -o bandit-report.json --exit-zero

      # Security gate: fail the pipeline on any HIGH severity finding
      - name: Bandit gate (HIGH severity)
        run: bandit -r app --severity-level high

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Snyk resolves the dependency tree from the installed packages
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1308.3

      # Security gate: fail the pipeline on HIGH or CRITICAL vulnerable dependencies
      - name: Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --file=requirements.txt
          --package-manager=pip
          --severity-threshold=high
          --json-file-output=snyk-report.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snyk-report
          path: snyk-report.json

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t tp2-notes:${{ github.sha }} .

      # Ephemeral environment: the app runs in a throwaway container on this runner
      - name: Start application container
        run: |
          docker run -d --name notes-app -p 8000:8000 tp2-notes:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Application did not become healthy" >&2
          exit 1

      # ZAP runs as a non-root user inside its container, so it needs a writable mount
      - name: Prepare ZAP working directory
        run: |
          mkdir zap-wrk
          cp openapi.yaml zap-wrk/
          chmod -R a+rwx zap-wrk

      # Active scan of every endpoint described in the OpenAPI spec.
      # -I: don't fail on ZAP's own warnings, the gate step below decides.
      - name: OWASP ZAP API scan
        run: >
          docker run --rm --network host
          -v "${{ github.workspace }}/zap-wrk:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy:2.17.0
          zap-api-scan.py
          -t openapi.yaml -f openapi
          -J zap-report.json -r zap-report.html
          -I

      # Security gate: fail the pipeline on any High risk alert
      - name: ZAP gate (High risk)
        run: python3 scripts/zap_gate.py zap-wrk/zap-report.json high

      - name: Application logs
        if: always()
        run: docker logs notes-app

      # Tear down the ephemeral environment
      - name: Stop application container
        if: always()
        run: docker rm -f notes-app

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            zap-wrk/zap-report.json
            zap-wrk/zap-report.html
